version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: corsican-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: corsican
      MYSQL_USER: corsican
      MYSQL_PASSWORD: corsicanpass
    ports:
      - "3306:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: